name: Android CI (Debug)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        env:
          VITE_API_SERVER_URL: https://fadfada.94.237.56.203.nip.io
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure AdMob application ID
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: node scripts/configure-android-admob.mjs

      - name: Generate branded Android icons
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#2D1B69' --iconBackgroundColorDark '#151221' --splashBackgroundColor '#2D1B69' --splashBackgroundColorDark '#151221'

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fadfada-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
