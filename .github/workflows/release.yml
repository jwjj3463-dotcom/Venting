name: Publish Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        env:
          VITE_API_SERVER_URL: https://fadfada.94.237.56.203.nip.io
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase Authentication
        run: node scripts/configure-android-firebase.mjs

      - name: Configure Android APK updater
        run: node scripts/configure-android-updater.mjs

      - name: Configure AdMob application ID
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: node scripts/configure-android-admob.mjs

      - name: Generate branded Android icons
        run: npx @capacitor/assets generate --android --pwa --assetPath resources --iconBackgroundColor '#2D1B69' --iconBackgroundColorDark '#151221' --splashBackgroundColor '#2D1B69' --splashBackgroundColorDark '#151221' --pwaNoAppleFetch

      - name: Finalize web icon formats and safe maskable icon
        run: node scripts/finalize-brand-icons.mjs

      - name: Sync Android project
        run: npx cap sync android

      - name: Set Android release version
        run: node scripts/configure-android-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Validate and prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret." >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fadfadah-upload-key.p12"
          test -s "$RUNNER_TEMP/fadfadah-upload-key.p12"

      - name: Verify release signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/fadfadah-upload-key.p12" \
            -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -certreq \
            -keystore "$RUNNER_TEMP/fadfadah-upload-key.p12" \
            -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/fadfadah-signing-check.csr" \
            -noprompt >/dev/null
          rm -f "$RUNNER_TEMP/fadfadah-signing-check.csr"
          echo "Android release keystore and private key verified."

      - name: Verify Firebase Google OAuth signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          release_sha1="$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/fadfadah-upload-key.p12" \
            -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" | sha1sum | cut -d ' ' -f 1)"
          node --input-type=module - "$release_sha1" <<'NODE'
          import fs from 'node:fs';

          const releaseSha1 = process.argv[2]?.replaceAll(':', '').toLowerCase();
          const firebaseConfig = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const configuredSha1s = firebaseConfig.client.flatMap((client) =>
            (client.oauth_client ?? [])
              .filter((oauthClient) => oauthClient.client_type === 1)
              .map((oauthClient) => oauthClient.android_info?.certificate_hash?.replaceAll(':', '').toLowerCase())
              .filter(Boolean)
          );

          if (!releaseSha1 || !configuredSha1s.includes(releaseSha1)) {
            throw new Error('Firebase Google OAuth config does not include the release signing certificate SHA-1.');
          }

          console.log('Firebase Google OAuth config matches the release signing certificate.');
          NODE

      - name: Build signed APK and Google Play bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/fadfadah-upload-key.p12" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"

      - name: Verify APK signature and create checksums
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" "$AAB" > android-release-checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-checksums.txt
